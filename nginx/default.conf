server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 第四次课的可追溯检索应用挂在 /week04 前缀下，与前面几次课的部署互不干扰。
    location /week04/api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location = /week04/health {
        proxy_pass http://api:8081/health;
        proxy_set_header Host $http_host;
    }

    location = /week04/swagger { proxy_pass http://api:8081/swagger; }
    location = /week04/openapi.json { proxy_pass http://api:8081/openapi.json; }

    location = /week04 {
        return 301 /week04/;
    }

    location /week04/ {
        try_files $uri $uri/ /week04/index.html;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://api:8081/health;
        proxy_set_header Host $http_host;
    }

    location = /swagger { proxy_pass http://api:8081/swagger; }
    location = /openapi.json { proxy_pass http://api:8081/openapi.json; }

    location = / {
        return 301 /week04/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
