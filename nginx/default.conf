server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 第四次课的可追溯检索应用挂在 /week04 前缀下，与前面几次课的部署互不干扰。
    location /week04/api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location = /week04/health {
        proxy_pass http://api:8081/health;
        proxy_set_header Host $http_host;
    }

    location = /week04 {
        return 301 /week04/;
    }

    location /week04/ {
        try_files $uri $uri/ /week04/index.html;
    }

    location /api/ {
        proxy_pass http://api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }

    location = /health {
        proxy_pass http://api:8081/health;
        proxy_set_header Host $http_host;
    }

    location = / {
        return 301 /week04/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
